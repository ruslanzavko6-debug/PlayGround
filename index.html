<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="description" content="ВІРА — маленька атмосферна гра про те, що з'являється, коли віриш.">
<title>ВІРА — гра про те, що з'являється, коли віриш</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a18'/%3E%3Cpath d='M32 12c7 9 12 15 12 22a12 12 0 0 1-24 0c0-7 5-13 12-22z' fill='%23ffd88f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Ігрове поле"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div id="hud" class="hud hidden">
    <div class="hud-side">
      <div class="faith">
        <div class="faith-top">
          <span class="faith-label">ВІРА</span>
          <span class="faith-value" id="faithValue">100</span>
        </div>
        <div class="faith-bar"><div class="faith-fill" id="faithFill"></div></div>
      </div>
    </div>
    <div class="level-mark" id="levelMark">Розділ I</div>
    <div class="hud-side right">
      <div class="stat"><span class="stat-ico">✦</span><span id="sparkCount">0</span></div>
      <button id="muteBtn" class="icon-btn" type="button" aria-label="Звук">♪</button>
      <button id="pauseBtn" class="icon-btn" type="button" aria-label="Пауза">❚❚</button>
    </div>
  </div>

  <div id="touch" class="touch hidden">
    <div class="touch-group">
      <button class="tbtn" type="button" data-act="left" aria-label="Вліво">◀</button>
      <button class="tbtn" type="button" data-act="right" aria-label="Вправо">▶</button>
    </div>
    <div class="touch-group">
      <button class="tbtn tbtn-faith" type="button" data-act="believe" aria-label="Віра">ВІРА</button>
      <button class="tbtn tbtn-jump" type="button" data-act="jump" aria-label="Стрибок">↑</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="overlay" class="overlay">
    <div id="overlayPanel" class="panel"></div>
  </div>

  <div class="grain" aria-hidden="true"></div>
</div>
<script src="game.js"></script>
</body>
</html>
